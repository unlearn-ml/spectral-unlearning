# @package _global_

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: GradDiff
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_${hydra:runtime.choices.model}_full

forget_split: forget10
retain_split: ${paths.tofu_splits.${forget_split}.retain}
holdout_split: ${paths.tofu_splits.${forget_split}.holdout}
retain_logs_path: saves/eval/tofu_${hydra:runtime.choices.model}_${retain_split}/TOFU_EVAL.json
init_logs_path: saves/eval/tofu_${hydra:runtime.choices.model}_full/evals_${forget_split}/TOFU_EVAL.json
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    init_logs_path: ${init_logs_path}
    overwrite: true
    question_key: ${question_key}
    
data:
  anchor: forget
  forget:
    TOFU_QA_forget: 
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  args:
    warmup_epochs: 1.0

task_name: ???
